name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Resolve packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project Scopino.xcodeproj \
            -scheme Scopino \
            -clonedSourcePackagesDirPath .build/SourcePackages

      - name: Run unit tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project Scopino.xcodeproj \
            -scheme Scopino \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            -clonedSourcePackagesDirPath .build/SourcePackages \
            -derivedDataPath .build/DerivedData \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Scopino-test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
          retention-days: 14
